<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Sports Predictions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body { background-color: #0d1117; color: #c9d1d9; font-family: 'Inter', sans-serif; }
        .navbar { background-color: #161b22; border-bottom: 1px solid #30363d; }
        .header-logo { color: #10b981; font-weight: 800; font-size: 1.5rem; }
        .pick-card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 18px; margin-bottom: 16px; }
        .pick-card:hover { border-color: #58a6ff; }
        .league-title { font-size: 0.75rem; text-transform: uppercase; color: #8b949e; font-weight: 700; }
        .team-name { font-size: 1.1rem; font-weight: 700; color: #f0f6fc; }
        .prediction-box { background: #21262d; border-radius: 8px; padding: 10px 14px; text-align: center; border: 1px solid #30363d; }
        .pick-label { font-size: 0.7rem; color: #8b949e; text-transform: uppercase; font-weight: 600; }
        .pick-value { font-size: 1rem; font-weight: 800; color: #10b981; }
        .confidence-badge { background: rgba(16, 185, 129, 0.15); color: #10b981; border-radius: 20px; padding: 4px 10px; font-size: 0.8rem; font-weight: 700; }
        .vip-card { background: linear-gradient(135deg, #161b22 0%, #1c1917 100%); border: 1px solid #d97706; }
        .vip-value { color: #f59e0b; font-weight: 800; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark py-3">
        <div class="container">
            <a class="navbar-brand header-logo" href="#"><i class="fa-solid fa-chart-line me-2"></i>ATISTICS <span class="text-white">AI PICKS</span></a>
            <button class="btn btn-warning btn-sm fw-bold px-3"><i class="fa-solid fa-crown me-1"></i> VIP ACCESS</button>
        </div>
    </nav>

    <div class="container my-4">
        <div class="d-flex gap-2 mb-4 overflow-auto pb-2">
            <button class="btn btn-success btn-sm rounded-pill px-3 fw-bold">All Picks</button>
            <button class="btn btn-outline-secondary btn-sm rounded-pill px-3 text-white">🔥 High Confidence (%80+)</button>
            <button class="btn btn-outline-secondary btn-sm rounded-pill px-3 text-white">⚽ Over 2.5 Goals</button>
            <button class="btn btn-outline-warning btn-sm rounded-pill px-3 fw-bold">👑 VIP Only</button>
        </div>

        <!-- Normal Maç -->
        <div class="pick-card">
            <div class="row align-items-center">
                <div class="col-md-4 mb-2 mb-md-0">
                    <div class="league-title">Premier League • Today 20:00</div>
                    <div class="team-name mt-1">Arsenal vs Chelsea</div>
                </div>
                <div class="col-md-5 my-2 my-md-0">
                    <div class="row g-2">
                        <div class="col-6">
                            <div class="prediction-box">
                                <div class="pick-label">AI Prediction</div>
                                <div class="pick-value">Home Win (1)</div>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="prediction-box">
                                <div class="pick-label">Goals Market</div>
                                <div class="pick-value">Over 2.5</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3 text-md-end mt-2 mt-md-0">
                    <span class="confidence-badge"><i class="fa-solid fa-bolt me-1"></i> %84 Probability</span>
                </div>
            </div>
        </div>

        <!-- VIP Kilitli Maç -->
        <div class="pick-card vip-card">
            <div class="row align-items-center">
                <div class="col-md-4 mb-2 mb-md-0">
                    <div class="league-title text-warning">⭐ VIP EXCLUSIVE • Today 22:00</div>
                    <div class="team-name mt-1">Real Madrid vs Barcelona</div>
                </div>
                <div class="col-md-5 my-2 my-md-0 text-center">
                    <div class="p-2 rounded bg-dark border border-warning">
                        <span class="vip-value"><i class="fa-solid fa-lock me-2"></i>HIGH ODDS VIP PICK LOCKED</span>
                    </div>
                </div>
                <div class="col-md-3 text-md-end mt-2 mt-md-0">
                    <button class="btn btn-warning btn-sm fw-bold w-100">Unlock Pick</button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
